name = "clipfactory-api"
main = "src/index.js"
compatibility_date = "2026-10-30"

[vars]
ADMIN_EMAIL = "admnclip@gmail.com"
ALLOWED_ORIGIN = "https://clipfactory-aer.pages.dev"
BACKUP_URL = "https://clipfactory-storage-backup.inipastiuy-41f.workers.dev"

[[d1_databases]]
binding = "DB"
database_name = "clipfactory-db"
database_id = "0dda2127-8c55-44e0-8716-22db54dbdfb9"

[[r2_buckets]]
binding = "MEDIA"
bucket_name = "clipfactory-media"

# Optional: create a Queue and uncomment.
# [[queues.producers]]
# binding = "VIDEO_QUEUE"
# queue = "clipfactory-video-jobs"

[observability.logs]
enabled = true
invocation_logs = true

[ai]
binding = "AI"
